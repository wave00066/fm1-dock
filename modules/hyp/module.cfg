# HYP-1: RustyPawz/fm1-HYP1 (1.5.0, 824316e), RedtailWorks' hypnotic techno and acid machine, AMB-1's fork (take.py)
name = HYP-1
version = 1
sources = hyp/dsp/amb.c
# the FPU, as HYP-1 builds itself (its single-precision floats in the general registers: nothing more to save in the
# audio interrupt); its UI -Os and its engine -O2, as HYP-1 builds them; the plate in 16 bits and the performance
# FX's ring 0.5 s (0.95 in HYP-1: a quarter note down to 121 BPM), for a module's RAM (take.py)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/hyp/hyp -Imodules/hyp/hyp/app -Imodules/hyp/hyp/dsp -DPL_Q=8192 -DRB_N=11000 -Os
cflags hyp/dsp/amb.c = -O2
